name: Keep Backend Alive

# Render's free tier spins the backend down after ~15 min idle, causing a
# 30-60s cold start on the next request (surfaced as slow/failed logins).
# Pinging /health every 10 minutes keeps it from ever going to sleep.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 70 https://sahaplay-backend.onrender.com/health
          echo "Backend is awake"
