name: Android — Generate signing keystore (ONE-TIME USE)

# Run this exactly ONCE, ever, for this app. It generates the permanent
# upload keystore used to sign every future SahaPlay Android build. Do NOT
# re-run it after the keystore has been saved as repo secrets — doing so
# would produce a different signing certificate, which would invalidate
# assetlinks.json and make the Play Store treat future uploads as belonging
# to a different, unrelated app.
#
# After running:
#   1. Download both artifacts from this run (the .keystore file and
#      credentials.txt).
#   2. Store them somewhere durable — e.g. a password manager attachment
#      plus one offline backup copy. Losing this file blocks all future
#      app updates unless Play App Signing has been enrolled.
#   3. Add 4 new repo secrets (Settings → Secrets and variables → Actions):
#        ANDROID_KEYSTORE_BASE64   — contents of sahaplay-upload.keystore.b64
#        ANDROID_KEYSTORE_PASSWORD — from credentials.txt
#        ANDROID_KEY_ALIAS         — from credentials.txt (sahaplay)
#        ANDROID_KEY_PASSWORD      — from credentials.txt
#   4. Share the printed SHA-256 fingerprint (safe to share — it's meant to
#      be public, it's what goes in assetlinks.json).
#   5. Delete this run from the Actions history, then delete this workflow
#      file from the repo.

on:
  workflow_dispatch: {}

jobs:
  generate-keystore:
    name: Generate upload keystore
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and credentials
        run: |
          set -euo pipefail

          STORE_PASS="$(openssl rand -base64 24)"
          KEY_PASS="$(openssl rand -base64 24)"
          ALIAS="sahaplay"
          KEYSTORE_FILE="sahaplay-upload.keystore"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=SahaPlay, OU=Engineering, O=SahaPlay, C=US"

          base64 -w0 "$KEYSTORE_FILE" > "${KEYSTORE_FILE}.b64"

          FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$ALIAS" -storepass "$STORE_PASS" | grep 'SHA256:' | sed 's/.*SHA256: //')"

          {
            echo "alias=$ALIAS"
            echo "keystorePassword=$STORE_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "sha256Fingerprint=$FINGERPRINT"
          } > credentials.txt

          echo "### Keystore generated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 fingerprint (safe to share — this is public info that goes in assetlinks.json):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download both artifacts below, store them securely, add the 4 repo secrets from credentials.txt, then delete this run and this workflow file." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-upload-keystore
          path: sahaplay-upload.keystore.b64
          if-no-files-found: error

      - name: Upload credentials artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-keystore-credentials
          path: credentials.txt
          if-no-files-found: error
