name: Android — Build TWA (.aab)

on:
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build signed Android App Bundle (Bubblewrap TWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # bubblewrap always runs a first-use setup check that interactively asks
      # whether to install its own JDK/Android SDK, UNLESS ~/.bubblewrap/config.json
      # already has both paths filled in (confirmed by reading @bubblewrap/cli's
      # config.js source directly). Writing it here points Bubblewrap at the
      # JDK/SDK the two setup steps above already installed, skipping that prompt
      # entirely instead of guessing at a flag.
      - name: Point Bubblewrap at the pre-installed JDK/Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {"jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME"}
          EOF

      # bubblewrap init's project wizard (name/package/colors/icons/signing key)
      # is unconditionally interactive in this CLI version, with no
      # non-interactive flag (confirmed by reading init.js's confirmTwaConfig()).
      # Every value it would ask for is already known from the live
      # manifest.json, so this file is authored directly instead, matching the
      # exact schema read from @bubblewrap/core's TwaManifest.d.ts. `bubblewrap
      # update` (used below instead of `init`) regenerates the whole Android
      # project from this file non-interactively — confirmed from source that
      # it has no prompts of its own as long as appVersion === appVersionCode
      # (auto-bumped) and the directory doesn't need to pre-exist.
      - name: Write Bubblewrap project config (twa-manifest.json)
        run: |
          mkdir -p android-twa
          cat > android-twa/twa-manifest.json <<'EOF'
          {
            "packageId": "com.sahaplay.app",
            "host": "sahaplay.com",
            "name": "SahaPlay",
            "launcherName": "SahaPlay",
            "display": "standalone",
            "orientation": "default",
            "themeColor": "#6366F1",
            "themeColorDark": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#00000000",
            "navigationDividerColorDark": "#00000000",
            "backgroundColor": "#0F0F1A",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://sahaplay.com/logos/trans_appstore.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./sahaplay-upload.keystore",
              "alias": "sahaplay"
            },
            "appVersionCode": 1,
            "appVersion": "1",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sahaplay.com/manifest.json",
            "fallbackType": "customtabs",
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 21
          }
          EOF

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-twa/sahaplay-upload.keystore

      - name: Generate Android project (bubblewrap update)
        working-directory: android-twa
        run: bubblewrap update --skipVersionUpgrade

      # getPasswords() in build.js reads these two exact env var names and
      # skips prompting entirely if both are set (confirmed from source) —
      # no CLI password flags exist for this.
      - name: Build signed .aab
        working-directory: android-twa
        run: bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-android-aab
          path: android-twa/app-release-bundle.aab
          if-no-files-found: error
