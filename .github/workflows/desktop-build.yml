name: Desktop — Build Windows Installer

on:
  workflow_dispatch: {}

permissions:
  contents: write # needed so the publish step below can create/update the "desktop-latest" GitHub Release

jobs:
  build-windows:
    name: Build Windows installer (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      # No web asset build here — tauri.conf.json's build.frontendDist and the
      # main window's url both point straight at the production site
      # (https://sahaplay.com), so the installer just wraps a native shell that
      # loads the live app. There's nothing local to compile for the frontend.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Publishes the just-built installer to a GitHub Release under a fixed,
      # never-changing tag ("desktop-latest") — DownloadAppModal.jsx's "Get
      # Desktop App" button links straight to this exact URL. Before this,
      # running this workflow only produced a downloadable Actions artifact;
      # nobody ever manually re-uploaded it to the actual public download
      # link, so it kept serving whatever build was first uploaded (dated
      # months ago, missing every native fix since). Deleting-then-recreating
      # the release (rather than trying to update an existing one in place)
      # sidesteps any "asset already exists"/stale-tag ambiguity — this
      # always ends up a clean, single release pointing at the current build.
      # Renaming to a version-independent filename means the frontend's
      # hardcoded URL never has to change even if tauri.conf.json's version
      # number is bumped later.
      - name: Publish to GitHub Release (stable "desktop-latest" tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SRC=$(ls frontend/src-tauri/target/release/bundle/nsis/*.exe | head -n 1)
          STABLE_NAME="SahaPlay-Windows-Setup.exe"
          cp "$SRC" "$STABLE_NAME"
          gh release delete desktop-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create desktop-latest "$STABLE_NAME" \
            --repo "${{ github.repository }}" \
            --title "SahaPlay Desktop (latest build)" \
            --notes "Automatically published by the Desktop build workflow on every run — this is always the current Windows build. The in-app \"Get Desktop App\" link points directly here." \
            --latest
