name: Desktop — Build Windows Installer

on:
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build Windows installer (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      # No web asset build here — tauri.conf.json's build.frontendDist and the
      # main window's url both point straight at the production site
      # (https://sahaplay.com), so the installer just wraps a native shell that
      # loads the live app. There's nothing local to compile for the frontend.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
