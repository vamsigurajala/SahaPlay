name: Weekly Database Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container:
      image: postgres:17
    steps:
      - name: Verify pg_dump version
        run: pg_dump --version

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump \
            "${DATABASE_URL}?sslmode=require" \
            --no-password \
            --format=plain \
            --no-acl \
            --no-owner \
            --file=/tmp/backup_$(date +%Y%m%d_%H%M%S).sql
          echo "Backup complete"
          ls -lh /tmp/backup_*.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-backup-${{ github.run_number }}
          path: /tmp/backup_*.sql
          retention-days: 90
