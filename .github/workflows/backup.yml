name: Weekly Database Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container:
      image: postgres:17
    steps:
      - name: Verify pg_dump version
        run: pg_dump --version

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured in repository secrets!"
            exit 1
          fi

          CONN_URL="$DATABASE_URL"
          if [[ "$CONN_URL" != *"sslmode="* ]]; then
            if [[ "$CONN_URL" == *"?"* ]]; then
              CONN_URL="${CONN_URL}&sslmode=require"
            else
              CONN_URL="${CONN_URL}?sslmode=require"
            fi
          fi

          pg_dump \
            "$CONN_URL" \
            --no-password \
            --format=plain \
            --no-acl \
            --no-owner \
            --file=/tmp/backup_$(date +%Y%m%d_%H%M%S).sql
          echo "Backup complete"
          ls -lh /tmp/backup_*.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-backup-${{ github.run_number }}
          path: /tmp/backup_*.sql
          retention-days: 90
