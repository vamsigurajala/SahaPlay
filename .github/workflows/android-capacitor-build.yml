name: Android — Build Capacitor app (.aab)

on:
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build signed Android App Bundle (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 7's generated Gradle project (AGP/Kotlin toolchain) requires
      # JDK 21, one major version newer than the old Bubblewrap/TWA build's 17.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # Produces frontend/dist. The app actually displays the live
      # `server.url` below at runtime (same "just load the real site" model
      # already proven by the Tauri desktop build's frontendDist config) —
      # this local build only exists to satisfy Capacitor's webDir
      # requirement, not because its output is what users see.
      - name: Build web assets
        working-directory: frontend
        run: npm run build

      - name: Install Capacitor CLI + Android platform
        working-directory: frontend
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      # Hand-authored, same "write the config the CLI would otherwise ask for
      # interactively" approach already used for the old TWA build's
      # twa-manifest.json. server.url keeps this pointed at the live prod
      # site instead of the bundled (webDir) copy, so normal web deploys
      # reach app users instantly without a native rebuild.
      - name: Write Capacitor project config
        working-directory: frontend
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sahaplay.app",
            "appName": "SahaPlay",
            "webDir": "dist",
            "server": { "url": "https://sahaplay.com", "cleartext": false },
            "android": { "backgroundColor": "#0F0F1A" }
          }
          EOF

      - name: Generate Android project (cap add android)
        working-directory: frontend
        run: npx cap add android

      # Our own native code — a small custom plugin exposing real device
      # volume/brightness to the web player's swipe gestures, plus a
      # MainActivity that registers it. Both are hand-written and committed
      # under capacitor-android-plugin/, copied into the freshly generated
      # (never-committed) android/ tree on every run rather than living
      # inside it directly, same "regenerate from source of truth" approach
      # the old TWA build used for its own android-twa/ directory.
      - name: Add SahaplayMedia native plugin
        working-directory: frontend
        run: |
          cp capacitor-android-plugin/SahaplayMediaPlugin.java android/app/src/main/java/com/sahaplay/app/SahaplayMediaPlugin.java
          cp capacitor-android-plugin/MainActivity.java android/app/src/main/java/com/sahaplay/app/MainActivity.java

      - name: Sync Capacitor project
        working-directory: frontend
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/sahaplay-upload.keystore

      - name: Build signed .aab
        working-directory: frontend/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/sahaplay-upload.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-android-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
