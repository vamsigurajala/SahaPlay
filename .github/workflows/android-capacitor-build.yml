name: Android — Build Capacitor app (.aab)

on:
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build signed Android App Bundle (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 7's generated Gradle project (AGP/Kotlin toolchain) requires
      # JDK 21, one major version newer than the old Bubblewrap/TWA build's 17.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Explicit `packages:` because this action's own default list
      # ("tools platform-tools") includes the legacy standalone Android SDK
      # "tools" package — Google has since pulled it from the SDK repository
      # XML entirely, so `sdkmanager` fails outright trying to install it
      # ("Warning: Failed to find package 'tools'", exit code 1) on any
      # fresh run. Only platform-tools is actually needed here — the Gradle
      # build below (Android Gradle Plugin) fetches the specific
      # platform/build-tools versions it needs on its own once licenses are
      # accepted, which this action also handles.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # Produces frontend/dist. The app actually displays the live
      # `server.url` below at runtime (same "just load the real site" model
      # already proven by the Tauri desktop build's frontendDist config) —
      # this local build only exists to satisfy Capacitor's webDir
      # requirement, not because its output is what users see.
      - name: Build web assets
        working-directory: frontend
        run: npm run build

      # All Capacitor-related packages installed in ONE call, deliberately —
      # confirmed locally that separate/later `npm install` calls on top of
      # an already-installed tree can silently re-resolve and prune hundreds
      # of unrelated packages (caught this by reproducing it: a lone
      # `npm install fs-extra` after installing @capacitor/core/cli/android
      # dropped 384 already-installed packages). fs-extra is included
      # explicitly because @capacitor/assets (used below to generate real
      # app icons) depends on it transitively but doesn't reliably pull it
      # in on its own — also confirmed by reproducing the resulting
      # "Cannot find module 'fs-extra'" crash locally.
      #
      # No --no-save here (unlike the first Capacitor migration) — confirmed
      # locally that `cap sync`'s plugin autolinking discovers plugins by
      # scanning package.json's dependencies, not just node_modules
      # presence. With --no-save, @capacitor/status-bar and @capacitor/app
      # below were installed but silently never linked into the native
      # project ("Updating Android plugins" found 0 plugins), so their Java
      # code never made it into the built app. This only edits package.json
      # inside the ephemeral CI checkout — nothing is committed back.
      # @capacitor/splash-screen deliberately NOT installed — its own
      # JS-driven splash (a static, non-animated logo shown via splash.png)
      # was showing as a redundant "screen" before our own JS-based
      # AnimatedSplash.jsx even got a chance to run, so the user saw the
      # logo appear twice (once static, then again animated). Without this
      # plugin, only the OS's own unavoidable Android 12+ cold-start frame
      # remains (see the styles.xml step below, now blanked to a plain white
      # frame with no icon) — the very first branded logo the user sees is
      # already our animated one.
      # @capacitor/filesystem added for the native download fix — the
      # in-app "Save" buttons (lightbox/file-card/voice-note) need this
      # plugin's Java side actually present in the built app; the frontend
      # only ever calls it off window.Capacitor.Plugins.Filesystem (see
      # nativeDownload.js's own comment on why no direct import), so this
      # line is the ONLY place that plugin needs to be named at all.
      # @capacitor/preferences added so search history (useSearchHistory.js)
      # survives this device class's aggressive background-kill behavior —
      # real-device testing found entries silently failing to persist when
      # backed by the WebView's own localStorage alone; SharedPreferences via
      # this plugin doesn't share that failure mode.
      # @capawesome/capacitor-app-update wraps Google Play Core's in-app
      # update API — AppUpdateBanner.jsx's "a new version is available"
      # strip (frontend/src/lib/appUpdate.js) calls it off
      # window.Capacitor.Plugins.AppUpdate, same ambient-proxy pattern as
      # every other plugin here, so (same as them) it's never added to the
      # committed package.json either. Deliberately unpinned, same reasoning
      # as every other package on this line: installed together in one
      # resolution pass so npm picks a version of this plugin that's
      # actually compatible with whatever @capacitor/core major also
      # resolves to here, rather than two separate installs risking a
      # mismatched pair. No AndroidManifest or extra Gradle config needed
      # beyond `cap sync` per the plugin's own docs.
      - name: Install Capacitor packages
        working-directory: frontend
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/status-bar @capacitor/app @capacitor/browser @capacitor/push-notifications @capacitor/filesystem @capacitor/preferences @capawesome/capacitor-app-update fs-extra

      # Hand-authored, same "write the config the CLI would otherwise ask for
      # interactively" approach already used for the old TWA build's
      # twa-manifest.json. server.url keeps this pointed at the live prod
      # site instead of the bundled (webDir) copy, so normal web deploys
      # reach app users instantly without a native rebuild.
      #
      # plugins.StatusBar.overlaysWebView: true (NOT false — see below) plus
      # nativeShell.js's initNativeStatusBarInset(), which republishes the
      # real measured status-bar height as the --sp-status-bar-inset CSS var
      # that every top-of-screen bar/header in the app pads against instead
      # of the (broken in this WebView) env(safe-area-inset-top).
      #
      # This used to be overlaysWebView: false, on the theory that it makes
      # the native shell reserve real space for the status bar so the app's
      # own CSS never has to. That was true on Android <15 — false made
      # Capacitor call WindowCompat.setDecorFitsSystemWindows(window, true),
      # which the OS actually honored, auto-shifting the WebView down. But
      # Android 15 (API 35) enforces edge-to-edge for every app process-wide
      # with no per-app opt-out: setDecorFitsSystemWindows(true) is silently
      # ignored on any Android 15+ device regardless of this setting, so the
      # WebView drew full-bleed behind the status bar there anyway — while
      # our own JS-computed --sp-status-bar-inset padding was ALSO applying
      # on top, since it can't detect which behavior the OS actually gave it.
      # Net effect: fine on Android 15+, but on Android <15 (still common —
      # e.g. most budget phones) the real reserved space AND our own CSS
      # padding both applied, stacking into the reported "so much space
      # under the nav bar" gap — while a handful of other devices reportedly
      # lost the status bar's icons entirely, consistent with an OEM-skinned
      # WebView getting confused by the OS auto-reservation conflicting with
      # a page that also expects edge-to-edge (exact mechanism not provable
      # without those specific physical devices).
      #
      # Setting this true makes the WebView ALWAYS draw edge-to-edge, on
      # every Android version, matching what 15+ already forces unconditionally
      # — so there is exactly one inset mechanism (our own JS/CSS one) on
      # every device instead of two different ones depending on OS version.
      # backgroundColor/style below are just the first-frame default (matches
      # the default 'dark' theme); App.jsx syncs both live on every theme
      # toggle via nativeShell.js's syncStatusBarTheme().
      - name: Write Capacitor project config
        working-directory: frontend
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sahaplay.app",
            "appName": "SahaPlay",
            "webDir": "dist",
            "server": { "url": "https://sahaplay.com", "cleartext": false },
            "android": { "backgroundColor": "#0F0F1A" },
            "plugins": {
              "StatusBar": {
                "overlaysWebView": true,
                "style": "DARK",
                "backgroundColor": "#0b0c10"
              }
            }
          }
          EOF

      - name: Generate Android project (cap add android)
        working-directory: frontend
        run: npx cap add android

      # @capacitor/browser (added for native Google Sign-In — opened in a
      # Chrome Custom Tab since Google blocks its OAuth screen inside any
      # embedded WebView) pulls in androidx.browser 1.9.0, which refuses to
      # build against Capacitor's generated project defaults (compileSdk 35,
      # Android Gradle Plugin 8.7.2) — confirmed by the exact
      # ":app:checkReleaseAarMetadata FAILED" error this produces, naming
      # both the required compileSdk 36 and AGP 8.9.1+.
      #
      # variables.gradle: appended rather than sed-patched — its exact
      # generated formatting is Capacitor-version-dependent and not safe to
      # pattern-match sight-unseen, but Gradle evaluates the file top to
      # bottom, so a later plain reassignment of the same ext properties
      # reliably wins regardless of how the originals above it are written.
      #
      # build.gradle: the AGP version lives inside a buildscript{} block,
      # which Gradle evaluates before anything else — unlike variables.gradle
      # above, a later override can't retroactively change which AGP already
      # started evaluating the rest of the file, so this has to actually
      # replace the classpath line in place. The surrounding
      # `classpath 'com.android.tools.build:gradle:...'` syntax is stable,
      # well-known Capacitor boilerplate (unlike the version number itself,
      # which isn't pinned against), so the match target itself is safe.
      # Gradle 8.11.1 (already in use per the CI log) satisfies AGP 8.9.1's
      # minimum Gradle requirement, so the wrapper itself needs no change.
      #
      # minSdkVersion 24: Play Console's automatic protection (Play Integrity)
      # rejects bundles with minSdk below 24; Capacitor's default is 23.
      - name: Bump compileSdk/targetSdk and AGP for androidx.browser
        working-directory: frontend
        run: |
          cat >> android/variables.gradle <<'EOF'

          ext.compileSdkVersion = 36
          ext.targetSdkVersion = 36
          ext.minSdkVersion = 24
          EOF
          sed -i "s/classpath 'com.android.tools.build:gradle:[^']*'/classpath 'com.android.tools.build:gradle:8.9.1'/" android/build.gradle
          cat android/variables.gradle
          cat android/build.gradle

      # Google Play requires a strictly increasing versionCode on every new
      # upload to the same app. cap add android's generated app/build.gradle
      # hardcodes `versionCode 1` / `versionName "1.0"` (confirmed by
      # generating this exact project locally — same "known, stable Capacitor
      # boilerplate" match-target reasoning already used for the AGP
      # classpath line above), and nothing here ever overrode it, so every
      # single CI build produced an identical, unusable-for-a-second-upload
      # versionCode 1.
      #
      # github.run_number is GitHub's own CI-provided counter for this
      # workflow: a plain positive integer that starts at 1 and only ever
      # increases across runs (a re-run of the same run keeps that run's own
      # number rather than reusing a stale one, and a new run is always
      # higher) — exactly the monotonic guarantee Play Store's versionCode
      # requires, with no extra state to track ourselves.
      #
      # versionName is deliberately left untouched — it stays the
      # human-readable "1.0" Capacitor already sets. Play Store never
      # requires versionName to be unique per upload, and bumping it isn't
      # part of the versionCode problem this step fixes; that's a deliberate
      # release-naming decision for whoever cuts an actual release, not
      # something to derive from a build counter.
      #
      # The grep checks (before and after) follow this file's own established
      # "fail loudly, don't silently ship the old versionCode" pattern used
      # for every other sed-based override here — if Capacitor's generated
      # app/build.gradle ever stops matching this known shape, this step
      # errors out instead of quietly leaving versionCode at 1 again.
      - name: Set release versionCode from the CI run number
        working-directory: frontend
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          grep -Eo "versionCode [0-9]+" android/app/build.gradle | wc -l | grep -qx 1 || { echo "::error::expected exactly one 'versionCode <int>' line in android/app/build.gradle — check its actual defaultConfig block and fix the sed match"; exit 1; }
          sed -i -E "s/versionCode [0-9]+/versionCode ${ANDROID_VERSION_CODE}/" android/app/build.gradle
          grep -qx "        versionCode ${ANDROID_VERSION_CODE}" android/app/build.gradle || { echo "::error::versionCode override did not take effect as expected"; exit 1; }
          echo "Release versionCode set to ${ANDROID_VERSION_CODE} (versionName left unchanged):"
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Push notifications (Firebase Cloud Messaging): @capacitor/push-
      # notifications needs the Google Services Gradle plugin applied plus
      # google-services.json present to know which Firebase project/app
      # this build belongs to — cap add android has no idea Firebase is
      # involved at all, so both have to be wired in by hand same as every
      # other native piece in this workflow. google-services.json itself is
      # NOT sensitive (it's a client config file meant to ship inside the
      # app, restricted by package name — not a secret key) so it's
      # committed under capacitor-android-plugin/ like everything else here;
      # the actual sensitive piece (the service-account key the backend
      # uses to SEND pushes) lives only in the Render env var, never in
      # this repo. classpath is appended right after the existing AGP
      # classpath line (inside the same buildscript{} dependencies block)
      # rather than as a separate append, since buildscript{} must be fully
      # populated before Gradle starts evaluating anything else — same
      # constraint already documented for the AGP version bump above.
      # Honesty note: the second sed's exact match target (app/build.gradle's
      # first line) is the one piece of this step not independently
      # confirmed against a real CI log the way build.gradle's AGP line was
      # — if Capacitor's generated app/build.gradle differs from the known
      # template on the actual runner, this fails LOUDLY (via the grep
      # check below) rather than silently shipping a build where push
      # notifications quietly never work; fix from the real file content
      # printed by the `cat` and re-run.
      - name: Wire up Firebase Cloud Messaging (push notifications)
        working-directory: frontend
        run: |
          cp capacitor-android-plugin/google-services.json android/app/google-services.json
          sed -i "s/\(classpath 'com.android.tools.build:gradle:[^']*'\)/\1\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
          sed -i "0,/apply plugin: 'com.android.application'/s//apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'/" android/app/build.gradle
          cat android/build.gradle
          cat android/app/build.gradle
          grep -q "classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle || { echo "::error::google-services classpath was not inserted into android/build.gradle"; exit 1; }
          grep -q "apply plugin: 'com.google.gms.google-services'" android/app/build.gradle || { echo "::error::google-services plugin was not applied in android/app/build.gradle — check its actual first lines above and fix the sed match"; exit 1; }

          # SahaplayFirebaseMessagingService.java imports FirebaseMessagingService/
          # RemoteMessage directly. @capacitor/push-notifications' own Android
          # module already depends on firebase-messaging to compile ITS
          # MessagingService.java (which ours subclasses), but Gradle doesn't
          # guarantee that dependency is exposed transitively to this app
          # module (depends on whether the plugin declared it as `api` or
          # `implementation`) — declaring it here directly, same as Firebase's
          # own official setup docs instruct any app module to do, removes
          # that uncertainty rather than relying on an unverified transitive
          # dependency. A second declaration of the same artifact is normal
          # and harmless; Gradle just resolves one canonical version via the
          # BoM below.
          # androidx.webkit is what MainActivity.java's WebSettingsCompat/
          # WebViewFeature calls (disabling the WebView's own algorithmic
          # dark-mode re-coloring on the always-dark call screens) need —
          # Capacitor's core Android module doesn't declare it as an `api`
          # dependency, so it isn't guaranteed exposed here either, same
          # "don't rely on an unverified transitive dependency" reasoning as
          # firebase-messaging above.
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.11.0')
              implementation 'com.google.firebase:firebase-messaging'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF
          cat android/app/build.gradle

      # Native calling engine (Phase 1 of the WhatsApp-style native-calling
      # project — see the plan doc for the full picture). Four new
      # dependencies, none previously used anywhere in this project:
      #   - stream-webrtc-android: the actively-maintained community rebuild
      #     of the same Chromium WebRTC source Google used to publish as
      #     org.webrtc:google-webrtc (now deprecated/unpublished) — same
      #     org.webrtc.* API surface, used for the native RTCPeerConnection
      #     mesh.
      #   - socket.io-client: a real Java/Android Socket.IO client, matching
      #     this project's backend (socket.io@^4.8.3, Engine.IO v4) — the
      #     native engine runs its own authenticated socket connection
      #     alongside (not instead of) the WebView's own, speaking the exact
      #     same call:* event protocol already used by CallContext.jsx.
      #   - lazysodium-android (+ its required jna:android-classifier
      #     dependency): libsodium's crypto_box_easy/crypto_box_open_easy is
      #     the same X25519 + XSalsa20-Poly1305 construction TweetNaCl's
      #     nacl.box implements (frontend/src/lib/crypto.js) — mandatory for
      #     the native engine's offer/answer/ICE payloads to actually
      #     decrypt on a real web/desktop peer, not just compile.
      #   - androidx.security:security-crypto: Keystore-backed
      #     EncryptedSharedPreferences, for storing the user's long-term NaCl
      #     secret key (handed over once from JS) between calls.
      #
      # Honesty note, exact same shape as the Firebase step above: on the
      # first run, lazysodium-android:5.1.4 failed to resolve (that version
      # never existed — confirmed via search.maven.org's own gav index,
      # which lists only 5.0.0/5.0.1/5.0.2/5.1.0 for com.goterl:
      # lazysodium-android, published as an .aar). Corrected to the real
      # latest, 5.1.0. This is exactly the "fails loudly, fix from the real
      # error" pattern this file already uses elsewhere — Phase 1's entire
      # purpose is proving the dependency set resolves and survives this
      # project's bundletool-based AAB→APK conversion (lazysodium ships a
      # real per-ABI native .so via JNI, the first JNI-bearing dependency
      # this project has ever added) before any calling logic is written on
      # top of it.
      - name: Add native calling engine dependencies (Phase 1 scaffolding)
        working-directory: frontend
        run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation 'io.getstream:stream-webrtc-android:1.3.1'
              implementation 'io.socket:socket.io-client:2.1.2'
              // 5.2.0 + JNA 5.17.0 ship 64-bit libsodium/libjnidispatch aligned for
              // 16 KB memory pages (Google Play requires it); 5.1.0/5.13.0 did not.
              implementation 'com.goterl:lazysodium-android:5.2.0@aar'
              implementation 'net.java.dev.jna:jna:5.17.0@aar'
              implementation 'androidx.security:security-crypto:1.1.0'
          }
          EOF
          cat android/app/build.gradle

      # androidx.biometric — SahaplayE2eePlugin.java's BiometricPrompt/
      # BiometricManager gate on the E2eeKeyStore-generated Keystore key
      # (Stage 2 of the device-unlock project). Deliberately separate from
      # the "Add native calling engine dependencies" step above — this
      # dependency belongs to the E2EE device-unlock feature, not calling.
      #
      # Honesty note, exact same shape as the lazysodium-android:5.1.4
      # mistake documented above: this was originally written as 1.2.0,
      # which failed CI with "Could not find androidx.biometric:biometric:
      # 1.2.0" — confirmed via Google's own real Maven index
      # (dl.google.com/dl/android/maven2/androidx/biometric/group-index.xml)
      # that 1.2.0 was NEVER published as a stable release; every version
      # after the real 1.1.0 (1.2.0-alpha01..alpha05, 1.4.0-alpha01..alpha07)
      # is alpha-only and was never promoted to stable. 1.1.0 already
      # contains everything SahaplayE2eePlugin.java actually uses
      # (BiometricPrompt, BiometricPrompt.CryptoObject,
      # BiometricManager.Authenticators.BIOMETRIC_STRONG | DEVICE_CREDENTIAL),
      # so this is a pure version-string correction, not a capability change.
      - name: Add androidx.biometric dependency (E2EE device unlock)
        working-directory: frontend
        run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF
          cat android/app/build.gradle

      # Unlike the old Bubblewrap/TWA build (which auto-derived the app icon
      # from manifest.json), `cap add android` ships Capacitor's own generic
      # placeholder icon and does nothing with our actual logo — this is why
      # the installed app showed no real icon.
      #
      # Both the launcher icon and the splash use light_appstore.png — the
      # logo variant meant to sit on a light surface (a brand-colored mark,
      # not the pale one meant for dark backgrounds), at app-store-asset
      # resolution (512x512 — the "_webl" logo variants are only 64x64, too
      # low-res once composited onto a full icon/splash canvas). Both are
      # composited onto a plain white canvas via --iconBackgroundColor/
      # --splashBackgroundColor. White is forced for BOTH the light and dark
      # variants of each intentionally — the ask was a white background
      # regardless of device theme, not a theme-adaptive one. Android's own
      # adaptive-icon masking is what turns this square into the circle (or
      # whatever shape a given launcher uses) seen on the home screen.
      - name: Generate real app icons and splash screen
        working-directory: frontend
        run: |
          mkdir -p resources
          cp public/logos/light_appstore.png resources/icon.png
          cp public/logos/light_appstore.png resources/splash.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' \
            --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#FFFFFF'

      # The white splash above is what @capacitor/splash-screen (a JS-driven
      # overlay) shows — but on Android 12+, the OS itself shows its OWN
      # native splash FIRST, for the brief window before the WebView/JS
      # engine has even started, using a completely separate theme
      # attribute (windowSplashScreenBackground) that @capacitor/assets'
      # splash generation does not touch. Without overriding it, that first
      # frame falls back to whatever the base AppTheme resolves to — which
      # is what was still showing as a black flash before our white splash
      # ever got a chance to render. `parent="AppTheme.NoActionBarLaunch"`
      # (same name as the style, defined in the unqualified values/
      # styles.xml cap add android already generated) is the standard
      # Android resource-qualifier pattern for "extend the base theme, only
      # overriding this one attribute, on API 31+ devices" — this genuinely
      # resolves correctly at runtime (Android's resource resolver looks up
      # the lower-priority values/ definition, not an infinite self-loop),
      # but Android Lint's static ResourceCycle check doesn't understand
      # that qualifier-folder trick and flags it as a fatal error anyway —
      # confirmed by an actual failed CI run naming this exact style.
      # tools:ignore suppresses that specific known-false-positive rather
      # than disabling lint checks broadly.
      #
      # windowSplashScreenAnimatedIcon was tried pointing at our own
      # transparent logo PNG, but that just moved the "double logo" problem
      # rather than fixing it — the OS briefly shows this native splash
      # (static logo) BEFORE the WebView/JS engine even starts, and then our
      # own AnimatedSplash.jsx (React, mounted once the page loads) plays
      # the same logo again, animated. The user sees the mark twice: once
      # static, once animated. Since @capacitor/splash-screen is no longer
      # installed (see the "Install Capacitor packages" step above) to
      # provide a second, longer-lived native splash, this OS-level frame is
      # now the ONLY native splash left, and it's set to blank (transparent
      # icon, white background) so it reads as a brief, neutral loading
      # blip rather than a distinct branded screen — the first time the
      # user actually sees the logo is when AnimatedSplash.jsx animates it
      # in. `@android:color/transparent` is used as the icon drawable
      # (Android accepts a color resource as a Drawable) instead of a real
      # image file, since there's nothing left to draw.
      - name: Blank the Android 12+ native splash screen (white, no icon)
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBarLaunch" tools:ignore="ResourceCycle">
                  <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              </style>
          </resources>
          EOF
          cat android/app/src/main/res/values-v31/styles.xml

      # Our own native code — a small custom plugin exposing real device
      # volume/brightness/orientation-lock/screen-capture to the web app
      # (nothing a plain WebView/browser can do), a foreground Service the
      # screen-capture feature runs its MediaProjection session inside
      # (Android requires this on API 29+ or captured frames come back
      # blank), plus a MainActivity that registers the plugin, plus a
      # manifest override adding the camera/mic/screen-capture permissions
      # the generated default omits (without them, Capacitor's built-in
      # getUserMedia permission bridge auto-denies with no system dialog
      # ever shown — confirmed by reading BridgeWebChromeClient.
      # onPermissionRequest in @capacitor/android locally). All hand-written
      # and committed under capacitor-android-plugin/, copied into the
      # freshly generated (never-committed) android/ tree on every run
      # rather than living inside it directly, same "regenerate from source
      # of truth" approach the old TWA build used for its own android-twa/
      # directory.
      # SahaplayFirebaseMessagingService + IncomingCallActivity (WhatsApp-style
      # 1:1 call ringing — full-screen lock-screen incoming-call UI, even with
      # the app backgrounded or fully killed, which a plain WebView/PWA can
      # never do): see the extensive comments in both files and in
      # AndroidManifest.xml for how these fit together with Capacitor's own
      # push-notifications plugin without breaking it.
      # Phase 2 native calling engine files (see the plan doc) — plain
      # copies into the generated project, same "source of truth lives
      # under capacitor-android-plugin/" pattern as every other native file
      # here. SahaplayCallPlugin.java is the new JS<->native bridge;
      # MainActivity.java (copied below) registers it.
      - name: Add native plugin, MainActivity, and manifest permissions
        working-directory: frontend
        run: |
          cp capacitor-android-plugin/SahaplayMediaPlugin.java android/app/src/main/java/com/sahaplay/app/SahaplayMediaPlugin.java
          cp capacitor-android-plugin/SahaplayScreenCaptureService.java android/app/src/main/java/com/sahaplay/app/SahaplayScreenCaptureService.java
          cp capacitor-android-plugin/SahaplayFirebaseMessagingService.java android/app/src/main/java/com/sahaplay/app/SahaplayFirebaseMessagingService.java
          cp capacitor-android-plugin/IncomingCallActivity.java android/app/src/main/java/com/sahaplay/app/IncomingCallActivity.java
          cp capacitor-android-plugin/SahaplayCallService.java android/app/src/main/java/com/sahaplay/app/SahaplayCallService.java
          cp capacitor-android-plugin/CallActionReceiver.java android/app/src/main/java/com/sahaplay/app/CallActionReceiver.java
          cp capacitor-android-plugin/MainActivity.java android/app/src/main/java/com/sahaplay/app/MainActivity.java
          cp capacitor-android-plugin/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp capacitor-android-plugin/res/drawable/ic_call_decline.xml android/app/src/main/res/drawable/ic_call_decline.xml
          cp capacitor-android-plugin/res/drawable/ic_call_answer.xml android/app/src/main/res/drawable/ic_call_answer.xml
          cp capacitor-android-plugin/res/drawable/ic_notification.xml android/app/src/main/res/drawable/ic_notification.xml
          mkdir -p android/app/src/main/res/raw
          cp capacitor-android-plugin/res/raw/*.wav android/app/src/main/res/raw/
          cp capacitor-android-plugin/CallCrypto.java android/app/src/main/java/com/sahaplay/app/CallCrypto.java
          cp capacitor-android-plugin/SecretKeyStore.java android/app/src/main/java/com/sahaplay/app/SecretKeyStore.java
          cp capacitor-android-plugin/PublicKeyCache.java android/app/src/main/java/com/sahaplay/app/PublicKeyCache.java
          cp capacitor-android-plugin/IceCandidateBuffer.java android/app/src/main/java/com/sahaplay/app/IceCandidateBuffer.java
          cp capacitor-android-plugin/TurnCredentialsFetcher.java android/app/src/main/java/com/sahaplay/app/TurnCredentialsFetcher.java
          cp capacitor-android-plugin/CallSocketClient.java android/app/src/main/java/com/sahaplay/app/CallSocketClient.java
          cp capacitor-android-plugin/LocalMediaController.java android/app/src/main/java/com/sahaplay/app/LocalMediaController.java
          cp capacitor-android-plugin/PeerConnectionWrapper.java android/app/src/main/java/com/sahaplay/app/PeerConnectionWrapper.java
          cp capacitor-android-plugin/CallSession.java android/app/src/main/java/com/sahaplay/app/CallSession.java
          cp capacitor-android-plugin/CallEngineService.java android/app/src/main/java/com/sahaplay/app/CallEngineService.java
          cp capacitor-android-plugin/SahaplayCallPlugin.java android/app/src/main/java/com/sahaplay/app/SahaplayCallPlugin.java
          cp capacitor-android-plugin/PhoneAccountRegistrar.java android/app/src/main/java/com/sahaplay/app/PhoneAccountRegistrar.java
          cp capacitor-android-plugin/SahaplayConnection.java android/app/src/main/java/com/sahaplay/app/SahaplayConnection.java
          cp capacitor-android-plugin/SahaplayConnectionService.java android/app/src/main/java/com/sahaplay/app/SahaplayConnectionService.java
          # E2EE device-unlock storage layer (Stage 1 of the device-unlock
          # project) — deliberately separate from SecretKeyStore.java above,
          # see E2eeKeyStore.java's own class comment for why. No new Gradle
          # dependency: it talks to java.security.KeyStore/javax.crypto
          # directly rather than androidx.security's EncryptedSharedPreferences.
          cp capacitor-android-plugin/E2eeKeyStore.java android/app/src/main/java/com/sahaplay/app/E2eeKeyStore.java
          mkdir -p android/app/src/main/res/xml
          cp capacitor-android-plugin/res/xml/data_extraction_rules.xml android/app/src/main/res/xml/data_extraction_rules.xml
          cp capacitor-android-plugin/res/xml/backup_rules.xml android/app/src/main/res/xml/backup_rules.xml
          # Stage 2: account-binding verification + the JS<->native bridge
          # itself. See DeviceAssertionVerifier.java's own class comment —
          # this pair closes the exploit the Stage 2 security review traced
          # (a compromised WebView forging an arbitrary account id to reach
          # a DIFFERENT, already-enrolled account's device-wrapped key).
          cp capacitor-android-plugin/DeviceAssertionVerifier.java android/app/src/main/java/com/sahaplay/app/DeviceAssertionVerifier.java
          cp capacitor-android-plugin/SahaplayE2eePlugin.java android/app/src/main/java/com/sahaplay/app/SahaplayE2eePlugin.java
          mkdir -p android/app/src/test/java/com/sahaplay/app
          cp capacitor-android-plugin/test/E2eeKeyStoreTest.java android/app/src/test/java/com/sahaplay/app/E2eeKeyStoreTest.java
          cp capacitor-android-plugin/test/DeviceAssertionVerifierTest.java android/app/src/test/java/com/sahaplay/app/DeviceAssertionVerifierTest.java

      # JUnit + Robolectric, for E2eeKeyStoreTest.java. Robolectric shadows
      # SharedPreferences realistically (so the per-account namespacing and
      # packing-envelope tests run as plain fast JVM tests, no
      # device/emulator needed) but does NOT provide a working
      # "AndroidKeyStore" JCA provider — see E2eeKeyStoreTest.java's own
      # class comment for exactly what that does and doesn't let this test
      # class cover.
      - name: Add E2eeKeyStore unit test dependencies
        working-directory: frontend
        run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.robolectric:robolectric:4.13'
              testImplementation 'androidx.test:core:1.6.1'
          }
          EOF
          cat android/app/build.gradle

      - name: Sync Capacitor project
        working-directory: frontend
        run: npx cap sync android

      - name: Preserve custom AndroidManifest.xml after cap sync
        working-directory: frontend
        run: |
          cp capacitor-android-plugin/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "Verifying autoVerify intent-filter in android/app/src/main/AndroidManifest.xml..."
          grep -q 'android:autoVerify="true"' android/app/src/main/AndroidManifest.xml || (echo "ERROR: autoVerify missing!" && exit 1)
          grep -q 'android:scheme="sahaplay"' android/app/src/main/AndroidManifest.xml || (echo "ERROR: sahaplay scheme missing!" && exit 1)

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/sahaplay-upload.keystore

      # Something in the resolved dependency graph (confirmed by generating
      # this exact project locally: androidx.activity/core/fragment/webkit at
      # the versions in variables.gradle, plus org.apache.cordova:framework)
      # pulls the old, pre-1.8 split kotlin-stdlib-jdk7/jdk8 artifacts, while
      # something else pulls the modern merged kotlin-stdlib — both contain
      # the same classes, so :app:checkReleaseDuplicateClasses fails. A prior
      # attempt applied a version-force via a separate --init-script, but the
      # old versions still showed up unchanged on the next run, so this
      # instead appends directly to the actual generated root build.gradle
      # (confirmed content by running `cap add android` locally) — excluding
      # the legacy split modules outright is also more certain than
      # version-forcing them, since kotlin-stdlib 1.8+ already contains
      # everything they used to provide.
      - name: Fix Kotlin stdlib duplicate-class conflict
        working-directory: frontend
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
                  }
              }
          }
          EOF
          cat android/build.gradle

      # Runs BEFORE the release build so a genuine E2eeKeyStore regression
      # (e.g. the IV/ciphertext packing envelope or per-account namespacing
      # breaking) fails this workflow loudly instead of silently shipping.
      # See E2eeKeyStoreTest.java's own comment for what this class of test
      # can and cannot cover — Keystore-dependent logic (real key
      # generation, StrongBox fallback, authentication-window behavior,
      # KeyPermanentlyInvalidatedException handling) is NOT exercised here
      # and can only be verified on a real device/emulator, same as every
      # other native Android crypto/calling path in this project.
      - name: Run E2eeKeyStore unit tests
        working-directory: frontend/android
        run: ./gradlew testDebugUnitTest --info

      - name: Build signed .aab
        working-directory: frontend/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/sahaplay-upload.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Stage 5 (device-unlock native validation): the .aab above is a Play
      # Store upload format — it cannot be installed directly on a device
      # (that's what bundletool's install-apks step would be for, which this
      # deliberately avoids). This is the exact same release variant/signing
      # config as the .aab above, just built via Android's plain "assemble"
      # task instead of "bundle" — the two are independent Gradle tasks (one
      # produces .aab under outputs/bundle/, the other .apk under
      # outputs/apk/) but AGP resolves the SAME release signingConfig for
      # both from these identical -Pandroid.injected.signing.* properties,
      # so this .apk is signed with the identical upload keystore/key as the
      # .aab above — same secrets, same values, nothing duplicated or
      # forked. Kept as its own step (not combined into one `./gradlew
      # bundleRelease assembleRelease` invocation) so the existing .aab
      # step/log above is untouched byte-for-byte if this one ever needs to
      # change independently.
      - name: Build signed .apk (for direct install on a physical device)
        working-directory: frontend/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/sahaplay-upload.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Informational only (never fails the build) — the merged-manifest
      # intermediate's exact path shifts between AGP versions, so this is a
      # best-effort `find` rather than a hardcoded path. Confirms
      # SahaplayFirebaseMessagingService ended up as the ONLY service
      # registered for MESSAGING_EVENT (see AndroidManifest.xml's
      # tools:node="remove" of Capacitor's own one) — if Capacitor's own
      # service is still present here too, FCM delivery for calls becomes
      # ambiguous and needs a fix-and-rerun.
      - name: Check merged manifest for FCM service conflicts and App Links
        working-directory: frontend/android
        run: |
          manifest=$(find app/build/intermediates -iname "AndroidManifest.xml" -path "*merged*" | head -n1)
          if [ -z "$manifest" ]; then
            echo "::warning::Could not locate a merged manifest intermediate to check — skipping this diagnostic."
          else
            echo "Checking $manifest"
            grep -B2 -A2 "MESSAGING_EVENT" "$manifest" || echo "::warning::No MESSAGING_EVENT service found in merged manifest"
            echo "Checking autoVerify in merged manifest:"
            grep -B2 -A6 "autoVerify" "$manifest" || echo "::warning::No autoVerify intent-filter found in merged manifest"
          fi

      # Unlike desktop-build.yml, this workflow has no GitHub Release publish
      # step after this — these two artifacts (downloaded manually and
      # uploaded to Play Console / side-loaded) are the ONLY way this build
      # ever reaches anyone, so they can't be made continue-on-error the way
      # desktop-build's redundant copies were. This workflow runs often
      # during active development, and with no retention-days set here
      # (defaulting to the repo's max, commonly 90 days), every single run's
      # signed .aab+.apk — each commonly tens of MB — piled up for up to 90
      # days each. That's almost certainly what actually filled the account's
      # shared Actions artifact storage quota (the thing that then made
      # desktop-build.yml's own upload step fail). A build only ever needs to
      # be grabbed shortly after it finishes, so a much shorter window is
      # plenty and keeps this workflow from refilling the quota as fast.
      - name: Upload signed .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-android-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # Standard AGP `assembleRelease` output path (parallel to the .aab's
      # own outputs/bundle/release/ above). Directly installable via
      # `adb install` or by side-loading onto a physical phone — no
      # bundletool/device-spec step needed for a single universal APK.
      - name: Upload signed .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaplay-android-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
