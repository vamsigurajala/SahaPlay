name: CI — Lint and Build

on:
  push:
    branches: [main, fix]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Lint
        run: cd frontend && npm run lint
        continue-on-error: true

      - name: Build
        run: cd frontend && npm run build

  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Backend startup check
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-real
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          DATABASE_URL: postgresql://placeholder
          FRONTEND_URL: http://localhost:5173
          RESEND_API_KEY: re_placeholder
          FROM_EMAIL: test@example.com
        run: |
          cd backend
          timeout 10s node -e "
            process.env.NODE_ENV = 'test';
            // require('./server.js') calls server.listen(), which succeeds and
            // keeps the process alive (open HTTP/Socket.IO listener) even though
            // the DB connection to the placeholder DATABASE_URL fails in the
            // background. So a successful load must exit(0) explicitly here —
            // otherwise the process hangs until the outer 'timeout' kills it,
            // which would fail this step (via SIGTERM) on every healthy commit,
            // not just genuine load failures.
            try {
              require('./server.js');
              console.log('Module load check passed');
              process.exit(0);
            } catch(e) {
              // Expected — server tries to connect
              // to DB which will fail with placeholders
              // We only care that the module loads
              // without syntax/import errors
              const ok = [
                'ECONNREFUSED',
                'connect ETIMEDOUT',
                'getaddrinfo',
                'invalid connection string',
                'password authentication'
              ].some(s => e.message.includes(s));
              if (!ok) {
                console.error('Unexpected load error:',
                  e.message);
                process.exit(1);
              }
              console.log('Module load check passed');
              process.exit(0);
            }
          "

      - name: Run backend tests
        run: cd backend && npm test
