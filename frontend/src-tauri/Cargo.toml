[package]
name = "sahaplay-desktop"
version = "0.1.0"
description = "SahaPlay Desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: Tauri v2 gates system-tray support behind this feature flag
# (unlike v1, where it was always available). devtools: right-click ->
# Inspect Element (or Ctrl+Shift+I) is disabled in a release build by
# default — added specifically so the several silent-catch async chains in
# desktopNotify.js's notification path (permission check, native window
# state, the show_windows_toast invoke) can actually be diagnosed by
# reading the console on a real installed build, instead of guessing
# blind at what failed.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Used directly (not through tauri-plugin-notification's JS sendNotification)
# for exactly one reason: @tauri-apps/plugin-notification's own docs state its
# click/Actions API "is only available on mobile platforms" — on Windows a
# toast built through that plugin shows fine but a click on it is never
# relayed back to JS at all, which was the actual cause of "I click the
# notification and nothing happens, not even the taskbar flashes." This
# crate (the same one the plugin uses internally on Windows, confirmed via
# its own docs.rs page) exposes Toast::on_activated, which DOES fire for a
# plain body click (Option<String>::None) as well as an explicit button —
# see show_windows_toast below.
tauri-winrt-notification = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
