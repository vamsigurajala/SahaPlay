[package]
name = "sahaplay-desktop"
version = "0.1.0"
description = "SahaPlay Desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: Tauri v2 gates system-tray support behind this feature flag
# (unlike v1, where it was always available).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
