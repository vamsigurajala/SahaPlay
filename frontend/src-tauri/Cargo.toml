[package]
name = "sahaplay-desktop"
version = "0.1.0"
description = "SahaPlay Desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: Tauri v2 gates system-tray support behind this feature flag
# (unlike v1, where it was always available). devtools: right-click ->
# Inspect Element (or Ctrl+Shift+I) is disabled in a release build by
# default — kept enabled so desktopNotify.js's console logging (permission
# state, native window state, notification construction) can actually be
# read on a real installed build instead of guessing blind at failures.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-winrt-notification = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# device_unlock.rs (E2EE "device unlock" for Windows — DPAPI wraps the
# secret, UserConsentVerifier gates access to it). See that module's own
# doc comment for the full design; ported from the Android implementation
# (E2eeKeyStore.java/SahaplayE2eePlugin.java/DeviceAssertionVerifier.java).
#
# windows: DPAPI (Win32_Security_Cryptography) + the Windows Hello gate
# (Security_Credentials_UI's UserConsentVerifier, activated via its
# Win32_System_WinRT interop interface — NOT KeyCredentialManager, per the
# investigation that ruled it unsupported/unreliable outside UWP).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Security_Credentials_UI",
    "Foundation",
] }
# p256/base64: a Rust port of DeviceAssertionVerifier.java's ES256
# (ECDSA P-256 + SHA-256, DER-encoded signature) verification — the same
# device-enrollment-assertion backend/lib/deviceAssertion.js already
# issues for Android, reused as-is (same public key, same wire format).
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = "0.16"
base64 = "0.22"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
