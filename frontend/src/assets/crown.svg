<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24" fill="none">
  <defs>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Crown body -->
  <path d="M2 20 L4 8 L10 14 L16 4 L22 14 L28 8 L30 20 Z" fill="url(#crownGold)" stroke="#CC8800" stroke-width="0.8" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Base band -->
  <rect x="2" y="20" width="28" height="3" rx="1.5" fill="url(#crownGold)" stroke="#CC8800" stroke-width="0.6"/>
  <!-- Gem on top center -->
  <circle cx="16" cy="5" r="2" fill="#FF4444" stroke="#CC0000" stroke-width="0.5"/>
  <!-- Left gem -->
  <circle cx="4" cy="9" r="1.5" fill="#4488FF" stroke="#0044CC" stroke-width="0.4"/>
  <!-- Right gem -->
  <circle cx="28" cy="9" r="1.5" fill="#44FF88" stroke="#00CC44" stroke-width="0.4"/>
  <!-- Dots on band -->
  <circle cx="9" cy="21.5" r="1" fill="#CC8800"/>
  <circle cx="16" cy="21.5" r="1" fill="#CC8800"/>
  <circle cx="23" cy="21.5" r="1" fill="#CC8800"/>
</svg>
