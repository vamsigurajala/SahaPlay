<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>No connection · SahaPlay</title>
<style>
  :root {
    --bg: #0b0b14; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.1);
    --text: #ffffff; --muted: #a3a3b5; --brand1: #7c3aed; --brand2: #ec4899;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f8fc; --card: rgba(255,255,255,0.9); --border: rgba(0,0,0,0.08); --text: #111827; --muted: #5b6475; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background-image: radial-gradient(60% 50% at 50% 0%, rgba(124,58,237,0.22), transparent 70%);
  }
  .card {
    width: 100%; max-width: 380px; text-align: center; padding: 36px 28px;
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    animation: rise .45s cubic-bezier(.22,1,.36,1) both;
  }
  .icon {
    width: 76px; height: 76px; margin: 0 auto 20px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--brand1), var(--brand2));
    box-shadow: 0 10px 30px rgba(124,58,237,0.35);
    animation: pulse 2.4s ease-in-out infinite;
  }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
  p { margin: 0 0 24px; font-size: 14.5px; line-height: 1.55; color: var(--muted); }
  button {
    width: 100%; border: 0; border-radius: 14px; padding: 13px 18px; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--brand1), var(--brand2));
    transition: transform .12s, filter .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { filter: brightness(1.08); box-shadow: 0 8px 22px rgba(124,58,237,0.4); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .7; cursor: default; }
  .status { margin-top: 14px; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .card, .icon { animation: none; } }
</style>
</head>
<body>
  <main class="card" role="alert" aria-live="polite">
    <div class="icon" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8a15 15 0 0 0-9.4-4.7"/>
        <path d="M5 12.9a10 10 0 0 1 3.2-2"/><path d="M19 12.9a10 10 0 0 0-4.9-2.7"/>
        <path d="M8.5 16.4a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="0.6" fill="#fff"/>
        <path d="M2 2l20 20"/>
      </svg>
    </div>
    <h1 id="t">No internet connection</h1>
    <p id="d">Check your Wi-Fi or mobile data. SahaPlay will reconnect automatically as soon as you're back online.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status"></div>
  </main>
<script>
  (function () {
    var btn = document.getElementById('retry');
    var status = document.getElementById('status');
    var busy = false;
    // English fallback only — the real text lives in the app's translation
    // files (/locales/<lang>/translation.json: offlineTitle, offlineMessage,
    // offlineRetry, offlineChecking, offlineStillOffline), which the service
    // worker keeps cached from the last time the app was online.
    var s = [
      'No internet connection',
      "Check your Wi-Fi or mobile data. SahaPlay will reconnect automatically as soon as you're back online.",
      'Try again', 'Checking…', 'Still offline'
    ];
    var KEYS = ['offlineTitle', 'offlineMessage', 'offlineRetry', 'offlineChecking', 'offlineStillOffline'];
    var stored = ''; try { stored = localStorage.getItem('watch_language') || ''; } catch (e) {}
    var code = (stored || navigator.language || 'en').toLowerCase().split('-')[0];
    function apply(dict) {
      KEYS.forEach(function (k, i) { if (dict && typeof dict[k] === 'string' && dict[k]) s[i] = dict[k]; });
      document.getElementById('t').textContent = s[0];
      document.getElementById('d').textContent = s[1];
      btn.textContent = s[2];
    }
    apply(null);
    document.documentElement.lang = code;
    if (code === 'ar') document.documentElement.dir = 'rtl';
    fetch('/locales/' + code + '/translation.json').then(function (r) { return r.json(); }).then(apply).catch(function () {});

    function goBack() { location.reload(); }

    function check() {
      if (busy) return;
      busy = true; btn.disabled = true; status.textContent = s[3];
      // A real request, not just navigator.onLine (which can say "online" behind a dead network).
      fetch('/manifest.json?ts=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (r.ok) goBack(); else throw new Error('x'); })
        .catch(function () { status.textContent = s[4]; setTimeout(function () { status.textContent = ''; }, 2500); })
        .then(function () { busy = false; btn.disabled = false; });
    }

    btn.addEventListener('click', check);
    window.addEventListener('online', check);
    setInterval(function () { if (navigator.onLine) check(); }, 5000);
  })();
</script>
</body>
</html>
